# Opens a deep link and accepts iOS's "Open in Pawtrol?" prompt. The prompt can
# come back once the development build reloads, so it's checked twice.
appId: ${APP_ID}
---
- openLink: ${LINK}
- repeat:
    times: 2
    commands:
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            visible: Open
          commands:
            - tapOn: Open
