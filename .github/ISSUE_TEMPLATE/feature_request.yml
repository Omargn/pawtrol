name: Feature idea
description: Suggest something Pawtrol should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who runs into it, and when? Describe the need before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and abuse
      description: Could this reveal where someone lives, expose contact details, or be used to spam or scam? How would you prevent it?
